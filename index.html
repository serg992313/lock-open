<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Замок BLE</title>
<style>body{margin:0;background:#0b1220;color:#e7ecf5;font:17px -apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:18px}
button{font:600 22px -apple-system,sans-serif;border:0;border-radius:24px;padding:26px 54px;background:#2563eb;color:#fff}
button:disabled{opacity:.5}input{font:16px monospace;padding:12px;border-radius:12px;border:1px solid #334;background:#121a29;color:#fff;text-align:center;width:200px}
#s{min-height:24px;text-align:center;max-width:320px}</style></head><body>
<button id="b">Открыть замок</button>
<button id="f" style="font-size:15px;padding:12px 24px;background:#1f2937">Настроить Face ID</button>
<input id="k" type="password" inputmode="numeric" placeholder="PIN"><div id="s"></div>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',NON='6e400002-b5a3-f393-e0a9-e50e24dcca9e',AUTH='6e400003-b5a3-f393-e0a9-e50e24dcca9e',STAT='6e400004-b5a3-f393-e0a9-e50e24dcca9e';
const k=document.getElementById('k'),s=document.getElementById('s'),b=document.getElementById('b');
k.value=localStorage.getItem('bk')||'';
let dev=null;
// Pure-JS HMAC-SHA256: Web Crypto is missing on non-HTTPS pages.
function sha256(m){const K=[];let p=2;while(K.length<64){let q=true;for(let i=2;i*i<=p;i++)if(p%i==0){q=false;break}if(q)K.push((Math.pow(p,1/3)%1)*4294967296|0);p++}
const H=[];p=2;while(H.length<8){let q=true;for(let i=2;i*i<=p;i++)if(p%i==0){q=false;break}if(q)H.push((Math.pow(p,.5)%1)*4294967296|0);p++}
const l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;new DataView(b.buffer).setUint32(n-4,l*8);
const w=new Int32Array(64),r=(x,c)=>(x>>>c)|(x<<(32-c));
for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=new DataView(b.buffer).getInt32(o+i*4);
for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(c,17)^r(c,19)^(c>>>10)))|0}
let[a,c,d,e,f,g,h,j]=H;for(let i=0;i<64;i++){const t1=(j+(r(f,6)^r(f,11)^r(f,25))+((f&g)^(~f&h))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&c)^(a&d)^(c&d)))|0;j=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
H[0]=(H[0]+a)|0;H[1]=(H[1]+c)|0;H[2]=(H[2]+d)|0;H[3]=(H[3]+e)|0;H[4]=(H[4]+f)|0;H[5]=(H[5]+g)|0;H[6]=(H[6]+h)|0;H[7]=(H[7]+j)|0}
const out=new Uint8Array(32),dv=new DataView(out.buffer);H.forEach((x,i)=>dv.setInt32(i*4,x));return out}
function hmacJs(key,msg){const k=new Uint8Array(64);k.set(key);const i=new Uint8Array(64+msg.length),o=new Uint8Array(96);
for(let x=0;x<64;x++){i[x]=k[x]^0x36;o[x]=k[x]^0x5c}i.set(msg,64);o.set(sha256(i),64);return sha256(o)}
async function sign(keyBytes,msg){
  if(window.crypto&&crypto.subtle){const key=await crypto.subtle.importKey('raw',keyBytes,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',key,msg))}
  return hmacJs(keyBytes,msg)}

const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function open(){
  if(k.value.length<4){s.textContent='Введите PIN';return}
  b.disabled=true;s.textContent='Подключение...';
  try{
    if(!dev)dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    const g=dev.gatt.connected?dev.gatt:await dev.gatt.connect();
    const svc=await g.getPrimaryService(SVC);
    const non=new Uint8Array((await (await svc.getCharacteristic(NON)).readValue()).buffer);
    const mac=await sign(sha256(new TextEncoder().encode(k.value)),non);
    const st=await svc.getCharacteristic(STAT);await st.startNotifications();
    const res=new Promise(r=>st.addEventListener('characteristicvaluechanged',e=>r(e.target.value.getUint8(0)),{once:true}));
    await (await svc.getCharacteristic(AUTH)).writeValueWithResponse(mac);
    const v=await Promise.race([res,new Promise(r=>setTimeout(()=>r(-1),4000))]);
    s.textContent=v==1?'Открыто':v==2?'Заблокировано на минуту':v==0?'Неверный ключ':'Нет ответа';
    if(v==1)localStorage.setItem('bk',k.value);
    g.disconnect();
  }catch(e){s.textContent='Ошибка: '+e.message;dev=null}
  b.disabled=false;
}
const f=document.getElementById('f');
const faceId=localStorage.getItem('fid');
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
f.textContent=faceId?'Face ID: включён (сбросить)':'Настроить Face ID';
f.onclick=async()=>{
  if(faceId){localStorage.removeItem('fid');location.reload();return}
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Замок'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'lock',displayName:'Замок'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    localStorage.setItem('fid',b64(c.rawId));location.reload();
  }catch(e){s.textContent='Face ID не настроен: '+e.message}
};
// Face ID gate before the BLE command (local check on this phone)
async function gate(){
  const id=localStorage.getItem('fid');if(!id)return true;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:'public-key',id:unb64(id)}],userVerification:'required',timeout:60000}});return true}
  catch(e){s.textContent='Face ID не подтверждён';return false}
}
b.onclick=async()=>{if(await gate())open()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
